<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT Quiz Trainer – blamevlan</title>
<style>
  :root {
    --bg:     #0d1117; --bg2: #161b22; --bg3: #21262d;
    --border: #30363d; --text: #e6edf3; --dim:  #8b949e;
    --green:  #3fb950; --red:  #f85149; --yellow:#d29922;
    --blue:   #58a6ff; --purple:#bc8cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Consolas','Courier New',monospace;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; padding: 2rem 1rem;
  }
  h1 { color: var(--blue); font-size: 1.5rem; letter-spacing: 2px; margin-bottom: .2rem; }
  .subtitle { color: var(--dim); font-size: .82rem; margin-bottom: 1.5rem; }

  .topbar {
    width: 100%; max-width: 680px;
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: .75rem;
  }
  .lang-btn {
    padding: .3rem .8rem; border-radius: 5px;
    border: 1px solid var(--border); background: var(--bg3);
    color: var(--dim); cursor: pointer; font-family: inherit; font-size: .8rem;
  }
  .lang-btn:hover { border-color: var(--blue); color: var(--blue); }

  .card {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 10px; padding: 1.5rem;
    width: 100%; max-width: 680px; margin-bottom: 1rem;
  }
  .screen { display: none; width: 100%; max-width: 680px; }
  .screen.active { display: block; }

  /* Language screen */
  .lang-list { display: flex; flex-direction: column; gap: .6rem; margin-top: 1rem; }
  .lang-item {
    padding: .75rem 1rem; border-radius: 7px;
    border: 1px solid var(--border); background: var(--bg3);
    cursor: pointer; transition: border-color .15s, background .15s; font-size: .9rem;
  }
  .lang-item:hover { border-color: var(--blue); background: #1a2233; }

  /* Menu */
  .menu-title { font-size: 1rem; font-weight: bold; margin-bottom: 1rem; }
  .mode-list { display: flex; flex-direction: column; gap: .6rem; margin-bottom: 1.2rem; }
  .mode-item {
    padding: .75rem 1rem; border-radius: 7px;
    border: 1px solid var(--border); background: var(--bg3);
    cursor: pointer; transition: border-color .15s, background .15s;
  }
  .mode-item:hover { border-color: var(--blue); background: #1a2233; }
  .mode-num  { color: var(--blue); font-size: .85rem; margin-right: .5rem; }
  .mode-label { font-size: .9rem; font-weight: bold; }
  .mode-desc  { font-size: .78rem; color: var(--dim); margin-top: .2rem; }

  /* Difficulty */
  .diff-list { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: 1rem; }
  .diff-item {
    flex: 1; min-width: 140px; padding: .75rem 1rem; border-radius: 7px;
    border: 1px solid var(--border); background: var(--bg3);
    cursor: pointer; transition: border-color .15s, background .15s; font-size: .88rem;
  }
  .diff-item:hover { border-color: var(--yellow); background: #1a1800; }
  .diff-num { color: var(--yellow); font-weight: bold; margin-right: .4rem; }

  /* Back button */
  .back-btn {
    display: inline-flex; align-items: center; gap: .4rem;
    padding: .3rem .7rem; border-radius: 5px;
    border: 1px solid var(--border); background: transparent;
    color: var(--dim); cursor: pointer; font-family: inherit; font-size: .82rem;
    margin-bottom: 1rem; transition: border-color .15s, color .15s;
  }
  .back-btn:hover { border-color: var(--text); color: var(--text); }

  /* Score bar */
  .score-bar { display: flex; gap: 1.5rem; font-size: .85rem; color: var(--dim); margin-bottom: 1.2rem; flex-wrap: wrap; }
  .score-bar .ok  { color: var(--green); font-weight: bold; }
  .score-bar .bad { color: var(--red);   font-weight: bold; }
  .score-bar .pct { color: var(--yellow); font-weight: bold; }

  /* Question */
  .q-meta { color: var(--dim); font-size: .8rem; margin-bottom: .6rem; }
  .q-text { font-size: 1rem; font-weight: bold; margin-bottom: 1.2rem; line-height: 1.5; }
  .opts { display: flex; flex-direction: column; gap: .5rem; margin-bottom: 1rem; }
  .opt-btn {
    padding: .65rem 1rem; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg3);
    color: var(--text); cursor: pointer; font-family: inherit; font-size: .88rem;
    text-align: left; transition: border-color .15s, background .15s;
    display: flex; align-items: flex-start; gap: .75rem;
  }
  .opt-btn:hover:not(:disabled) { border-color: var(--blue); background: #1a2233; }
  .opt-btn:disabled { cursor: default; }
  .opt-btn.correct  { border-color: var(--green); background: #0d2a0f; color: var(--green); }
  .opt-btn.wrong    { border-color: var(--red);   background: #2a0d0d; color: var(--red);   }
  .opt-num { color: var(--blue); font-size: .8rem; flex-shrink: 0; padding-top: .1rem; }

  /* Feedback */
  .feedback { display: none; margin-top: .75rem; }
  .feedback.show { display: block; }
  .fb-wrong  { color: var(--red);    font-size: .88rem; margin-bottom: .4rem; }
  .fb-hint   { color: var(--yellow); font-size: .83rem; margin-bottom: .4rem; padding: .5rem .75rem; background: #1e1800; border-radius: 5px; border: 1px solid #3d3000; }
  .fb-correct { color: var(--green); font-size: .88rem; margin-bottom: .4rem; }
  .fb-tip    { color: var(--dim);    font-size: .8rem;  margin-bottom: .4rem; }

  /* Attempt indicator */
  .attempts { display: flex; gap: .3rem; margin-bottom: .8rem; }
  .attempt-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--border); transition: background .2s;
  }
  .attempt-dot.used { background: var(--red); }
  .attempt-dot.active { background: var(--yellow); }

  /* Buttons */
  .btn-row { display: flex; gap: .75rem; margin-top: 1rem; flex-wrap: wrap; }
  button.primary {
    padding: .5rem 1.3rem; border-radius: 6px; border: none;
    background: var(--blue); color: #000; font-family: inherit;
    font-weight: bold; font-size: .88rem; cursor: pointer; transition: opacity .15s;
  }
  button.primary:hover { opacity: .85; }
  button.secondary {
    padding: .5rem 1.1rem; border-radius: 6px;
    border: 1px solid var(--border); background: transparent;
    color: var(--dim); font-family: inherit; font-size: .88rem; cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  button.secondary:hover { border-color: var(--text); color: var(--text); }

  /* Result */
  .result-score { font-size: 2rem; font-weight: bold; color: var(--yellow); margin: .5rem 0; }
  .result-detail { color: var(--dim); font-size: .88rem; margin-bottom: 1rem; }
  .result-msg { font-size: .95rem; font-weight: bold; margin-bottom: 1.2rem; }
  .result-msg.good { color: var(--green); }
  .result-msg.mid  { color: var(--yellow); }
  .result-msg.bad  { color: var(--red); }
</style>
</head>
<body>

<!-- ── Language ─────────────────────────────────────────────── -->
<div id="screen-lang" class="screen active">
  <div class="card">
    <h1>IT QUIZ</h1>
    <div class="subtitle" id="sub">github.com/blamevlan</div>
    <div class="lang-list">
      <div class="lang-item" onclick="setLang('de')">🇩🇪 Deutsch</div>
      <div class="lang-item" onclick="setLang('en')">🇬🇧 English</div>
    </div>
  </div>
</div>

<!-- ── Menu ─────────────────────────────────────────────────── -->
<div id="screen-menu" class="screen">
  <div class="topbar">
    <h1>IT QUIZ</h1>
    <button class="lang-btn" onclick="showScreen('screen-lang')" id="btn-lang">de / en</button>
  </div>
  <div class="card">
    <div class="menu-title" id="menu-title"></div>
    <div class="mode-list">
      <div class="mode-item" onclick="selectMode(0)">
        <div><span class="mode-num">[1]</span><span class="mode-label" id="mode0-label"></span></div>
        <div class="mode-desc" id="mode0-desc"></div>
      </div>
      <div class="mode-item" onclick="selectMode(1)">
        <div><span class="mode-num">[2]</span><span class="mode-label" id="mode1-label"></span></div>
        <div class="mode-desc" id="mode1-desc"></div>
      </div>
      <div class="mode-item" onclick="selectMode(2)">
        <div><span class="mode-num">[3]</span><span class="mode-label" id="mode2-label"></span></div>
        <div class="mode-desc" id="mode2-desc"></div>
      </div>
    </div>
  </div>
</div>

<!-- ── Difficulty ───────────────────────────────────────────── -->
<div id="screen-diff" class="screen">
  <div class="topbar">
    <h1>IT QUIZ</h1>
    <button class="lang-btn" onclick="showScreen('screen-lang')" id="btn-lang2">de / en</button>
  </div>
  <div class="card">
    <button class="back-btn" onclick="showScreen('screen-menu')">← <span id="back-menu"></span></button>
    <div class="menu-title" id="diff-title"></div>
    <div class="diff-list">
      <div class="diff-item" onclick="startQuiz(1)">
        <div><span class="diff-num">[1]</span><span id="diff1-label"></span></div>
        <div style="font-size:.76rem;color:var(--dim);margin-top:.2rem" id="diff1-desc"></div>
      </div>
      <div class="diff-item" onclick="startQuiz(2)">
        <div><span class="diff-num">[2]</span><span id="diff2-label"></span></div>
        <div style="font-size:.76rem;color:var(--dim);margin-top:.2rem" id="diff2-desc"></div>
      </div>
    </div>
  </div>
</div>

<!-- ── Quiz ─────────────────────────────────────────────────── -->
<div id="screen-quiz" class="screen">
  <div class="topbar">
    <h1>IT QUIZ</h1>
    <button class="back-btn" onclick="showScreen('screen-menu')" style="margin-bottom:0">← <span id="back-menu2"></span></button>
  </div>
  <div class="card">
    <div class="score-bar">
      <span><span class="ok" id="s-ok">0</span>✓</span>
      <span><span class="bad" id="s-bad">0</span>✗</span>
      <span><span class="pct" id="s-pct">0%</span></span>
    </div>
    <div class="q-meta" id="q-meta"></div>
    <div class="q-text" id="q-text"></div>
    <div class="attempts" id="attempts"></div>
    <div class="opts" id="opts"></div>
    <div class="feedback" id="feedback">
      <div class="fb-wrong"  id="fb-wrong"></div>
      <div class="fb-hint"   id="fb-hint"  style="display:none"></div>
      <div class="fb-correct" id="fb-correct" style="display:none"></div>
      <div class="fb-tip"    id="fb-tip"   style="display:none"></div>
    </div>
    <div class="btn-row" id="btn-row" style="display:none">
      <button class="primary"   id="btn-next"   onclick="nextStep()"></button>
      <button class="secondary" id="btn-skip"   onclick="skipToMenu()" style="display:none"></button>
    </div>
  </div>
</div>

<!-- ── Result ───────────────────────────────────────────────── -->
<div id="screen-result" class="screen">
  <div class="topbar"><h1>IT QUIZ</h1></div>
  <div class="card">
    <div class="menu-title" id="res-title"></div>
    <div class="result-score" id="res-score"></div>
    <div class="result-detail" id="res-detail"></div>
    <div class="result-msg" id="res-msg"></div>
    <div class="btn-row">
      <button class="primary"   onclick="startQuiz(currentDiff)" id="btn-retry"></button>
      <button class="secondary" onclick="showScreen('screen-menu')" id="btn-menu-r"></button>
    </div>
  </div>
</div>

<script>
// ── Questions ──────────────────────────────────────────────────────────────────
const QUESTIONS = {
  de: {
    osi: [
      { q:"Auf welcher OSI-Schicht arbeitet das IP-Protokoll?", opts:["Schicht 3 — Vermittlung (Network)","Schicht 2 — Sicherung (Data Link)","Schicht 4 — Transport","Schicht 1 — Bitübertragung (Physical)"], tip:"IP ist ein Layer-3-Protokoll. Router arbeiten auf Schicht 3.", level:"easy" },
      { q:"Wie heißt OSI-Schicht 7?", opts:["Anwendungsschicht (Application)","Sitzungsschicht (Session)","Transportschicht (Transport)","Darstellungsschicht (Presentation)"], tip:"Schicht 7 ist die Anwendungsschicht. HTTP, FTP, DNS und SMTP arbeiten hier.", level:"easy" },
      { q:"Wie heißt OSI-Schicht 1?", opts:["Bitübertragungsschicht (Physical)","Sicherungsschicht (Data Link)","Vermittlungsschicht (Network)","Transportschicht (Transport)"], tip:"Schicht 1 überträgt rohe Bits über ein physisches Medium. Kabel, Hubs, Repeater.", level:"easy" },
      { q:"Auf welcher OSI-Schicht arbeitet ein Switch?", opts:["Schicht 2 — Sicherung (Data Link)","Schicht 1 — Bitübertragung (Physical)","Schicht 3 — Vermittlung (Network)","Schicht 4 — Transport"], tip:"Ein Switch arbeitet mit MAC-Adressen auf Schicht 2. Layer-3-Switches können auch routen.", level:"easy" },
      { q:"Auf welcher OSI-Schicht arbeitet ein Router?", opts:["Schicht 3 — Vermittlung (Network)","Schicht 2 — Sicherung (Data Link)","Schicht 4 — Transport","Schicht 7 — Anwendung (Application)"], tip:"Router vermitteln Pakete anhand von IP-Adressen — das ist Schicht 3.", level:"easy" },
      { q:"Auf welcher OSI-Schicht arbeitet TCP?", opts:["Schicht 4 — Transport","Schicht 3 — Vermittlung (Network)","Schicht 2 — Sicherung (Data Link)","Schicht 7 — Anwendung (Application)"], tip:"TCP und UDP sind Transportprotokolle — Schicht 4.", level:"easy" },
      { q:"Auf welcher OSI-Schicht arbeitet HTTP?", opts:["Schicht 7 — Anwendung (Application)","Schicht 4 — Transport","Schicht 3 — Vermittlung (Network)","Schicht 6 — Darstellung (Presentation)"], tip:"HTTP ist ein Anwendungsprotokoll — Schicht 7.", level:"easy" },
      { q:"Wie heißt OSI-Schicht 2?", opts:["Sicherungsschicht (Data Link)","Bitübertragungsschicht (Physical)","Vermittlungsschicht (Network)","Transportschicht (Transport)"], tip:"Schicht 2 sichert die Übertragung zwischen direkt verbundenen Geräten. MAC-Adressen, Ethernet.", level:"easy" },
      { q:"Auf welcher OSI-Schicht arbeitet ein Hub?", opts:["Schicht 1 — Bitübertragung (Physical)","Schicht 2 — Sicherung (Data Link)","Schicht 3 — Vermittlung (Network)","Schicht 4 — Transport"], tip:"Ein Hub leitet alle Signale an alle Ports weiter — rein physisch, Schicht 1.", level:"easy" },
      { q:"Wie heißt OSI-Schicht 4?", opts:["Transportschicht (Transport)","Sitzungsschicht (Session)","Vermittlungsschicht (Network)","Anwendungsschicht (Application)"], tip:"Schicht 4 regelt den zuverlässigen Transport von Daten. TCP und UDP.", level:"easy" },
      { q:"Welche Schicht ist für MAC-Adressen zuständig?", opts:["Schicht 2 — Sicherung (Data Link)","Schicht 3 — Vermittlung (Network)","Schicht 1 — Bitübertragung (Physical)","Schicht 4 — Transport"], tip:"MAC-Adressen sind Hardware-Adressen und gehören zur Sicherungsschicht (Schicht 2).", level:"easy" },
      { q:"Auf welcher Schicht arbeitet UDP?", opts:["Schicht 4 — Transport","Schicht 3 — Vermittlung (Network)","Schicht 7 — Anwendung (Application)","Schicht 2 — Sicherung (Data Link)"], tip:"UDP ist wie TCP ein Transportprotokoll — Schicht 4. Schnell, ohne Verbindungsaufbau.", level:"easy" },
      { q:"Auf welcher OSI-Schicht arbeitet SSL/TLS?", opts:["Schicht 6 — Darstellung (Presentation)","Schicht 4 — Transport","Schicht 7 — Anwendung (Application)","Schicht 5 — Sitzung (Session)"], tip:"SSL/TLS verschlüsselt und kodiert Daten — das ist Aufgabe der Darstellungsschicht (Schicht 6).", level:"hard" },
      { q:"Wie heißt OSI-Schicht 5?", opts:["Sitzungsschicht (Session)","Darstellungsschicht (Presentation)","Transportschicht (Transport)","Anwendungsschicht (Application)"], tip:"Schicht 5 baut Sitzungen auf, verwaltet und beendet sie. NetBIOS, RPC.", level:"hard" },
      { q:"Wie heißt OSI-Schicht 6?", opts:["Darstellungsschicht (Presentation)","Sitzungsschicht (Session)","Anwendungsschicht (Application)","Transportschicht (Transport)"], tip:"Schicht 6 wandelt Daten in ein einheitliches Format um. Verschlüsselung, Komprimierung, Zeichensätze.", level:"hard" },
      { q:"Was ist die Hauptaufgabe der Sitzungsschicht (Schicht 5)?", opts:["Aufbau, Verwaltung und Abbau von Kommunikationssitzungen","Datenverschlüsselung und Komprimierung","Weiterleitung von Paketen anhand von IP-Adressen","Fehlererkennung bei der Datenübertragung"], tip:"Schicht 5 koordiniert den Dialog zwischen zwei Systemen — Aufbau, Synchronisation, Abbau.", level:"hard" },
      { q:"Auf welcher OSI-Schicht arbeitet DNS?", opts:["Schicht 7 — Anwendung (Application)","Schicht 3 — Vermittlung (Network)","Schicht 4 — Transport","Schicht 5 — Sitzung (Session)"], tip:"DNS ist ein Anwendungsprotokoll — Schicht 7.", level:"hard" },
      { q:"Auf welcher OSI-Schicht arbeitet SMTP?", opts:["Schicht 7 — Anwendung (Application)","Schicht 4 — Transport","Schicht 6 — Darstellung (Presentation)","Schicht 3 — Vermittlung (Network)"], tip:"SMTP überträgt E-Mails — es ist ein Anwendungsprotokoll auf Schicht 7.", level:"hard" },
      { q:"Was macht die Darstellungsschicht (Schicht 6)?", opts:["Datenkodierung, Verschlüsselung und Komprimierung","Aufbau und Abbau von Verbindungen","Weiterleitung von Datenpaketen","Zuverlässige Ende-zu-Ende-Übertragung"], tip:"Schicht 6 stellt sicher, dass Daten in einem für den Empfänger lesbaren Format vorliegen.", level:"hard" },
      { q:"Auf welcher Schicht arbeitet FTP?", opts:["Schicht 7 — Anwendung (Application)","Schicht 4 — Transport","Schicht 3 — Vermittlung (Network)","Schicht 6 — Darstellung (Presentation)"], tip:"FTP ist ein Anwendungsprotokoll — Schicht 7.", level:"hard" },
    ],
    abk: [
      { q:"Wofür steht DNS?", opts:["Domain Name System","Dynamic Network Service","Data Name Server","Domain Node System"], tip:"DNS löst Hostnamen in IP-Adressen auf.", level:"easy" },
      { q:"Wofür steht DHCP?", opts:["Dynamic Host Configuration Protocol","Domain Host Control Protocol","Dynamic Hardware Configuration Protocol","Data Host Communication Protocol"], tip:"DHCP vergibt automatisch IP-Adressen, Subnetzmaske, Gateway und DNS an Clients.", level:"easy" },
      { q:"Wofür steht HTTP?", opts:["Hypertext Transfer Protocol","High Transfer Text Protocol","Hypertext Transmission Program","Host Transfer Text Protocol"], tip:"HTTP ist das Protokoll für Webseiten. Port 80.", level:"easy" },
      { q:"Wofür steht HTTPS?", opts:["Hypertext Transfer Protocol Secure","High Transfer Text Protocol Secure","Hypertext Transmission Protocol System","Host Transfer Text Protocol Secure"], tip:"HTTPS ist HTTP mit TLS-Verschlüsselung. Port 443.", level:"easy" },
      { q:"Wofür steht TCP?", opts:["Transmission Control Protocol","Transfer Communication Protocol","Transport Control Program","Terminal Connection Protocol"], tip:"TCP sorgt für zuverlässige, geordnete Übertragung mit Fehlerkorrektur.", level:"easy" },
      { q:"Wofür steht UDP?", opts:["User Datagram Protocol","Universal Data Protocol","Unified Datagram Program","User Data Program"], tip:"UDP überträgt schnell ohne Verbindungsaufbau — ohne Garantie. Streaming, DNS, VoIP.", level:"easy" },
      { q:"Wofür steht VPN?", opts:["Virtual Private Network","Virtual Protocol Network","Verified Private Network","Virtual Public Network"], tip:"Ein VPN verschlüsselt den Datenverkehr und verbindet Netzwerke sicher über das Internet.", level:"easy" },
      { q:"Wofür steht LAN?", opts:["Local Area Network","Long Area Network","Local Access Node","Linked Area Network"], tip:"LAN bezeichnet ein lokales Netzwerk, z.B. in einem Büro oder Gebäude.", level:"easy" },
      { q:"Wofür steht WAN?", opts:["Wide Area Network","Wireless Area Network","Wide Access Node","World Area Network"], tip:"WAN verbindet Netzwerke über große geografische Distanzen. Das Internet ist das größte WAN.", level:"easy" },
      { q:"Wofür steht SSH?", opts:["Secure Shell","System Shell Handler","Secure Socket Host","System Secure Host"], tip:"SSH ermöglicht sichere, verschlüsselte Fernzugriffe. Port 22.", level:"easy" },
      { q:"Wofür steht FTP?", opts:["File Transfer Protocol","Fast Transfer Protocol","File Transmission Program","Full Transfer Protocol"], tip:"FTP überträgt Dateien. Port 21 (Steuerung), 20 (Daten). Unverschlüsselt — lieber SFTP.", level:"easy" },
      { q:"Wofür steht NAT?", opts:["Network Address Translation","Network Access Technology","Node Address Transfer","Network Allocation Table"], tip:"NAT übersetzt private IP-Adressen in öffentliche — viele Geräte teilen eine öffentliche IP.", level:"easy" },
      { q:"Wofür steht MAC (Netzwerk)?", opts:["Media Access Control","Machine Access Code","Media Address Code","Main Access Control"], tip:"Die MAC-Adresse ist eine Hardware-Adresse, weltweit eindeutig (48 Bit).", level:"easy" },
      { q:"Wofür steht WLAN?", opts:["Wireless Local Area Network","Wide Local Area Network","Wireless Linked Access Node","Wide Linked Area Network"], tip:"WLAN ist das Funknetzwerk nach IEEE 802.11. Umgangssprachlich Wi-Fi.", level:"easy" },
      { q:"Wofür steht IP?", opts:["Internet Protocol","Internal Protocol","Interface Program","Internet Program"], tip:"IP adressiert Geräte und leitet Pakete. IPv4 (32 Bit), IPv6 (128 Bit).", level:"easy" },
      { q:"Wofür steht OSPF?", opts:["Open Shortest Path First","Open System Path Finder","Optimized Shortest Path Forward","Open Subnet Path First"], tip:"OSPF ist ein Link-State-Routing-Protokoll für interne Netzwerke (IGP).", level:"hard" },
      { q:"Wofür steht BGP?", opts:["Border Gateway Protocol","Basic Gateway Protocol","Border Group Protocol","Broadband Gateway Protocol"], tip:"BGP ist das Routing-Protokoll des Internets — verbindet autonome Systeme (AS).", level:"hard" },
      { q:"Wofür steht ICMP?", opts:["Internet Control Message Protocol","Internal Control Message Protocol","Internet Communication Management Protocol","Integrated Control Message Protocol"], tip:"ICMP meldet Netzwerkfehler. Wird von ping und traceroute genutzt.", level:"hard" },
      { q:"Wofür steht ARP?", opts:["Address Resolution Protocol","Automatic Routing Protocol","Address Routing Program","Access Resolution Protocol"], tip:"ARP löst IP-Adressen in MAC-Adressen auf — im lokalen Netzwerk.", level:"hard" },
      { q:"Wofür steht LDAP?", opts:["Lightweight Directory Access Protocol","Local Directory Access Protocol","Linked Data Access Protocol","Lightweight Data Application Protocol"], tip:"LDAP fragt Verzeichnisdienste ab. Active Directory basiert auf LDAP.", level:"hard" },
      { q:"Wofür steht PKI?", opts:["Public Key Infrastructure","Private Key Interface","Public Key Interface","Protocol Key Infrastructure"], tip:"PKI verwaltet digitale Zertifikate und öffentliche Schlüssel.", level:"hard" },
      { q:"Wofür steht MFA?", opts:["Multi-Factor Authentication","Multi-Frequency Access","Managed Factor Authentication","Multi-Function Application"], tip:"MFA verlangt mindestens zwei Faktoren: Wissen (PIN), Besitz (Token), Biometrie.", level:"hard" },
      { q:"Wofür steht CVSS?", opts:["Common Vulnerability Scoring System","Central Vulnerability Security System","Common Vulnerability Security Score","Centralized Vulnerability Scoring System"], tip:"CVSS bewertet Schwachstellen auf einer Skala von 0 bis 10.", level:"hard" },
      { q:"Wofür steht IDS?", opts:["Intrusion Detection System","Internal Defense System","Integrated Detection System","Intrusion Defense System"], tip:"Ein IDS erkennt Angriffe und meldet sie — blockiert aber nicht aktiv.", level:"hard" },
      { q:"Wofür steht IPS?", opts:["Intrusion Prevention System","Internal Protection System","Integrated Prevention System","Intrusion Protection Service"], tip:"Ein IPS erkennt Angriffe und blockiert sie aktiv — Weiterentwicklung des IDS.", level:"hard" },

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ── Language ───────────────────────────────────────────────────────────────────
function setLang(l) {
  lang = l;
  T    = UI[l];
  document.getElementById("sub").textContent = T.subtitle;
  document.getElementById("menu-title").textContent = T.menu_title;
  for (let i = 0; i < 3; i++) {
    document.getElementById(`mode${i}-label`).textContent = T.mode_labels[i];
    document.getElementById(`mode${i}-desc`).textContent  = T.mode_descs[i];
  }
  document.getElementById("diff-title").textContent  = T.diff_title;
  document.getElementById("diff1-label").textContent = T.diff_labels[0];
  document.getElementById("diff1-desc").textContent  = T.diff_descs[0];
  document.getElementById("diff2-label").textContent = T.diff_labels[1];
  document.getElementById("diff2-desc").textContent  = T.diff_descs[1];
  document.getElementById("back-menu").textContent   = T.back_menu;
  document.getElementById("back-menu2").textContent  = T.back_menu;
  showScreen("screen-menu");
}

// ── Mode / Difficulty ──────────────────────────────────────────────────────────
function selectMode(idx) {
  currentMode = idx;
  showScreen("screen-diff");
}

function startQuiz(diff) {
  currentDiff = diff;
  const all   = QUESTIONS[lang][MODE_KEYS[currentMode]];
  pool        = diff === 1 ? shuffle(all.filter(q => q.level === "easy")) : shuffle([...all]);
  qIndex      = 0;
  correct     = 0;
  wrong       = 0;
  showScreen("screen-quiz");
  loadQuestion();
}

// ── Quiz ───────────────────────────────────────────────────────────────────────
function loadQuestion() {
  if (qIndex >= pool.length) { showResult(); return; }

  const q  = pool[qIndex];
  attempt  = 0;
  shuffled = shuffle(q.opts);
  rightIdx = shuffled.indexOf(q.opts[0]);

  updateScoreBar();
  document.getElementById("q-meta").textContent =
    `${T.question} ${qIndex + 1}/${pool.length}`;
  document.getElementById("q-text").textContent = q.q;

  renderAttemptDots();
  renderOpts();
  hideFeedback();
  document.getElementById("btn-row").style.display = "none";
}

function renderAttemptDots() {
  const el = document.getElementById("attempts");
  el.innerHTML = "";
  for (let i = 0; i < 3; i++) {
    const d = document.createElement("div");
    d.className = "attempt-dot" + (i === 0 ? " active" : "");
    el.appendChild(d);
  }
}

function updateAttemptDots() {
  const dots = document.querySelectorAll(".attempt-dot");
  dots.forEach((d, i) => {
    d.classList.remove("active","used");
    if (i < attempt)  d.classList.add("used");
    if (i === attempt && attempt < 3) d.classList.add("active");
  });
}

function renderOpts() {
  const el = document.getElementById("opts");
  el.innerHTML = "";
  shuffled.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt-btn";
    btn.innerHTML = `<span class="opt-num">[${i+1}]</span>${opt}`;
    btn.onclick = () => answer(i);
    el.appendChild(btn);
  });
}

function answer(idx) {
  attempt++;
  const q    = pool[qIndex];
  const btns = document.querySelectorAll(".opt-btn");
  btns.forEach(b => b.disabled = true);

  if (idx === rightIdx) {
    btns[idx].classList.add("correct");
    showFeedbackCorrect();
    if (attempt === 1) correct++;
    else wrong++;
    document.getElementById("btn-next").textContent = T.next;
    document.getElementById("btn-row").style.display = "flex";
    document.getElementById("btn-skip").style.display = "none";
    updateScoreBar();
    return;
  }

  // Wrong answer
  btns[idx].classList.add("wrong");
  const fb = document.getElementById("feedback");
  fb.classList.add("show");

  document.getElementById("fb-wrong").textContent =
    `${T.wrong}  ${T.your_ans}: ${shuffled[idx]}`;

  if (attempt === 1) {
    document.getElementById("fb-hint").style.display    = "none";
    document.getElementById("fb-correct").style.display = "none";
    document.getElementById("fb-tip").style.display     = "none";
    document.getElementById("fb-wrong").textContent     =
      `${T.wrong}  ${T.your_ans}: ${shuffled[idx]}`;
    // show try-again note
    const tryEl = document.createElement("div");
    tryEl.className = "fb-tip";
    tryEl.textContent = T.try_again;
    tryEl.id = "fb-tryagain";
    document.getElementById("fb-wrong").after(tryEl);
    document.getElementById("btn-next").textContent = T.next;
    document.getElementById("btn-row").style.display = "flex";
    document.getElementById("btn-skip").style.display = "none";
  } else if (attempt === 2) {
    const tryEl = document.getElementById("fb-tryagain");
    if (tryEl) tryEl.remove();
    document.getElementById("fb-hint").style.display = "block";
    document.getElementById("fb-hint").textContent   = `${T.hint_label}: ${q.tip}`;
    document.getElementById("fb-correct").style.display = "none";
    document.getElementById("fb-tip").style.display     = "none";
    document.getElementById("btn-next").textContent = T.next;
    document.getElementById("btn-row").style.display = "flex";
    // add "skip to menu" button
    document.getElementById("btn-skip").style.display = "inline-block";
    document.getElementById("btn-skip").textContent = T.to_menu;
  } else {
    // 3rd wrong — show solution
    const tryEl = document.getElementById("fb-tryagain");
    if (tryEl) tryEl.remove();
    btns[rightIdx].classList.add("correct");
    document.getElementById("fb-hint").style.display    = "none";
    document.getElementById("fb-correct").style.display = "block";
    document.getElementById("fb-correct").textContent   = `${T.correct_ans}: ${shuffled[rightIdx]}`;
    document.getElementById("fb-tip").style.display     = "block";
    document.getElementById("fb-tip").textContent       = `${T.tip_label}: ${q.tip}`;
    wrong++;
    updateScoreBar();
    document.getElementById("btn-next").textContent = T.next;
    document.getElementById("btn-row").style.display = "flex";
    document.getElementById("btn-skip").style.display = "none";
  }
  updateAttemptDots();
}

function nextStep() {
  const q    = pool[qIndex];
  const btns = document.querySelectorAll(".opt-btn");
  const answered = btns[rightIdx] && btns[rightIdx].classList.contains("correct");

  if (answered && attempt < 3 && !btns[rightIdx].classList.contains("correct")) return;

  // If still wrong and attempts left — re-enable options
  if (attempt < 3 && !btns[rightIdx].classList.contains("correct")) {
    hideFeedback();
    btns.forEach((b, i) => {
      if (!b.classList.contains("wrong")) { b.disabled = false; b.onclick = () => answer(i); }
    });
    document.getElementById("btn-row").style.display = "none";
    return;
  }

  // Move to next question
  qIndex++;
  loadQuestion();
}

function skipToMenu() {
  showScreen("screen-menu");
}

function hideFeedback() {
  const fb = document.getElementById("feedback");
  fb.classList.remove("show");
  document.getElementById("fb-wrong").textContent     = "";
  document.getElementById("fb-hint").style.display    = "none";
  document.getElementById("fb-hint").textContent      = "";
  document.getElementById("fb-correct").style.display = "none";
  document.getElementById("fb-tip").style.display     = "none";
  const tryEl = document.getElementById("fb-tryagain");
  if (tryEl) tryEl.remove();
}

function showFeedbackCorrect() {
  const fb = document.getElementById("feedback");
  fb.classList.add("show");
  document.getElementById("fb-wrong").textContent     = "";
  document.getElementById("fb-hint").style.display    = "none";
  const corr = document.getElementById("fb-correct");
  corr.style.display = "block";
  corr.textContent   = T.correct;
  const tip = pool[qIndex].tip;
  document.getElementById("fb-tip").style.display = "block";
  document.getElementById("fb-tip").textContent   = `${T.tip_label}: ${tip}`;
}

function updateScoreBar() {
  const total = correct + wrong;
  const pct   = total > 0 ? Math.round(correct / total * 100) : 0;
  document.getElementById("s-ok").textContent  = correct;
  document.getElementById("s-bad").textContent = wrong;
  document.getElementById("s-pct").textContent = pct + "%";
}

// ── Result ─────────────────────────────────────────────────────────────────────
function showResult() {
  const total = correct + wrong;
  const pct   = total > 0 ? Math.round(correct / total * 100) : 0;
  document.getElementById("res-title").textContent  = T.result_title;
  document.getElementById("res-score").textContent  = pct + "%";
  document.getElementById("res-detail").textContent =
    `${T.right}: ${correct}  |  ${T.wrong_c}: ${wrong}  |  ${T.total}: ${total}`;

  const msg = document.getElementById("res-msg");
  if (pct >= 80) { msg.textContent = T.score_good; msg.className = "result-msg good"; }
  else if (pct >= 50) { msg.textContent = T.score_mid; msg.className = "result-msg mid"; }
  else { msg.textContent = T.score_bad; msg.className = "result-msg bad"; }

  document.getElementById("btn-retry").textContent  = T.retry;
  document.getElementById("btn-menu-r").textContent = T.to_menu;
  showScreen("screen-result");
}

// ── Re-enable after wrong attempt ─────────────────────────────────────────────
// Override nextStep for mid-attempt flow
const _nextStep = nextStep;
document.getElementById("btn-next").addEventListener("click", () => {
  const btns = document.querySelectorAll(".opt-btn");
  const allWrong = [...btns].every(b => !b.classList.contains("correct"));

  if (allWrong && attempt < 3) {
    // Still have attempts — re-enable non-wrong options
    hideFeedback();
    btns.forEach((b, i) => {
      if (!b.classList.contains("wrong")) {
        b.disabled = false;
        b.onclick  = () => answer(i);
      }
    });
    document.getElementById("btn-row").style.display = "none";
    updateAttemptDots();
  } else {
    qIndex++;
    loadQuestion();
  }
}, { capture: true });

// Override the inline onclick to avoid double-firing
document.getElementById("btn-next").onclick = null;
</script>
</body>
</html>
